<style>
/* Layout: newspaper front page. Centred masthead over heavy rules, a lead story, then each desk as a two-column grid of stories divided by hairlines. Monotone throughout. */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #5c5c5c;
  --line: #d6d6d6;
  --rule: #111111;
  --tint: #f3f3f3;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] {
  --bg: #121212; --fg: #ececec; --muted: #a0a0a0; --line: #343434; --rule: #ececec; --tint: #1c1c1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; }

.label { font-family: var(--sans); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }

/* Masthead */
.strap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding-block: 14px 10px; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.strap-right { display: inline-flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.theme-toggle { display: inline-flex; align-items: center; gap: 8px; font: 600 0.72rem/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.theme-toggle:hover { border-color: var(--fg); }
.theme-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.tt-icon { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--fg); background: linear-gradient(90deg, var(--fg) 50%, transparent 50%); }
.masthead { text-align: center; padding-block: 10px 14px; border-top: 1px solid var(--line); }
.masthead .name { font-family: var(--serif); font-weight: 700; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1; letter-spacing: -0.02em; margin: 10px 0 0; }
.masthead .sub { font-family: var(--serif); font-style: italic; color: var(--muted); margin-top: 6px; font-size: 1rem; }
.rules { border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); height: 6px; }
nav.desks { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 28px; padding-block: 10px; border-bottom: 1px solid var(--line); }
nav.desks a { text-decoration: none; }
nav.desks a:hover { text-decoration: underline; }

/* Lead */
.lead { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 32px; padding-block: 32px 8px; }
.lead h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.6rem, 3vw, 2.15rem); line-height: 1.18; letter-spacing: -0.01em; margin: 8px 0 0; text-wrap: balance; }
.lead .kicker { color: var(--muted); }
.lead aside { border-left: 1px solid var(--line); padding-left: 24px; display: grid; align-content: start; gap: 10px; }
.lead aside p { margin: 0; font-family: var(--serif); font-size: 1.02rem; line-height: 1.5; }
.lead aside .meta { color: var(--muted); font-size: 0.82rem; font-family: var(--sans); }
@media (max-width: 760px) {
  .lead { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .lead aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
}

/* Desks */
section.desk { padding-top: 28px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
section.desk > h2 { margin: 0 0 4px; border-top: 2px solid var(--rule); }
.desk-toggle { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 4px; margin: 0; background: none; border: 0; color: var(--fg); font: 600 0.8rem/1.4 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; text-align: left; cursor: pointer; }
.desk-toggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.desk-toggle .t { display: inline-flex; align-items: center; gap: 10px; }

.desk-toggle[aria-expanded="false"] .chev { transform: rotate(-45deg); }
.desk-toggle .n { color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.desk-toggle:hover .t span:last-child { text-decoration: underline; text-underline-offset: 3px; }

nav.desks button.all { background: none; border: 0; padding: 0; color: var(--muted); font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
nav.desks button.all:hover { color: var(--fg); text-decoration: underline; }
nav.desks button.all:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.quiet { margin: 8px 0 0; font-family: var(--serif); font-style: italic; color: var(--muted); }
.stories { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
.stories.single { grid-template-columns: minmax(0, 1fr); max-width: 680px; }
@media (max-width: 760px) { .stories { grid-template-columns: minmax(0, 1fr); } }
.story { padding-block: 18px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; align-content: start; min-width: 0; }
.story .kick { color: var(--muted); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.story h3 { font-family: var(--serif); font-weight: 600; font-size: 1.32rem; line-height: 1.22; margin: 0; text-wrap: balance; }
.story p { margin: 0; font-family: var(--serif); font-size: 1.04rem; line-height: 1.55; }
.story .why { font-family: var(--sans); font-size: 0.9rem; line-height: 1.5; background: var(--tint); padding: 10px 12px; }
.story .why b { font-weight: 600; }
.story .src { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); }

/* Back pages */
.back { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; margin-top: 40px; }
@media (max-width: 760px) { .back { grid-template-columns: minmax(0, 1fr); } }
.back section { border-top: 2px solid var(--rule); padding-top: 8px; }
.back h2 { margin: 0 0 12px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.reads { list-style: none; margin: 0; padding: 0; display: grid; }
.reads li { padding-block: 10px; border-bottom: 1px solid var(--line); }
.reads a { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; text-decoration: none; }
.reads a:hover { text-decoration: underline; }
.reads .by { color: var(--muted); font-size: 0.8rem; margin-left: 6px; }
.reads p { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
.try h3 { font-family: var(--serif); font-weight: 600; font-size: 1.32rem; line-height: 1.22; margin: 0 0 8px; text-wrap: balance; }
.try p { margin: 0; font-family: var(--serif); font-size: 1.04rem; }

details.sources { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.sources summary { cursor: pointer; }
details.sources ol { margin: 12px 0 0; padding-left: 22px; display: grid; gap: 4px; font-size: 0.88rem; }
details.sources .d { color: var(--muted); font-variant-numeric: tabular-nums; }

.archive { margin-top: 40px; border-top: 2px solid var(--rule); padding-top: 8px; }
.archive h2 { margin: 0 0 8px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.archive ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 24px; }
.archive a { font-family: var(--serif); font-size: 1.02rem; font-variant-numeric: tabular-nums; }
.archive a[aria-current="true"] { font-weight: 700; text-decoration: none; }
footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

</head>

<script>
(function () {
  var issues = [];
  try { issues = JSON.parse(document.getElementById("issues-data").textContent); } catch (e) { issues = []; }
  var archive = document.getElementById("archive");
  var root = document.getElementById("issue");
  var desks = document.getElementById("desks");
  var strap = document.getElementById("strap-date");

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function safeUrl(u) { return typeof u === "string" && u.indexOf("https://") === 0 ? u : null; }
  function link(text, url, cls) {
    var u = safeUrl(url);
    if (!u) return el("span", { text: text });
    var a = el("a", { href: u, target: "_blank", rel: "noopener", text: text });
    if (cls) a.setAttribute("class", cls);
    return a;
  }
  function slug(id) { return "w-" + String(id).replace(/[^0-9a-z-]/gi, ""); }
  function jump(label, target) {
    return el("a", { href: location.hash || "#", "data-target": target, text: label });
  }

  function renderArchive(current) {
    archive.textContent = "";
    issues.forEach(function (iss) {
      var a = el("a", { href: "#" + slug(iss.id), text: "Week of " + iss.weekOf });
      if (iss === current) a.setAttribute("aria-current", "true");
      archive.appendChild(el("li", null, [a]));
    });
  }

  function renderIssue(iss) {
    root.textContent = ""; desks.textContent = "";
    if (!iss) {
      strap.textContent = "";
      root.appendChild(el("p", { class: "quiet", text: "The first issue will appear here after the next weekly run." }));
      return;
    }
    strap.textContent = "Week of " + iss.weekOf + " · covers " + iss.range;
    var sections = iss.sections || [];
    sections.forEach(function (s) { desks.appendChild(jump(s.title, "desk-" + s.key)); });
    desks.appendChild(jump("Past issues", "past"));

    root.appendChild(el("h1", { class: "sr-only", text: "Week of " + iss.weekOf }));

    sections.forEach(function (s) {
      var items = s.items || [];
      var sec = el("section", { class: "desk", id: "desk-" + s.key, "data-key": s.key });
      var bodyId = "deskbody-" + s.key;
      var btn = el("button", { type: "button", class: "desk-toggle", "aria-expanded": "true", "aria-controls": bodyId }, [
        el("span", { class: "t" }, [el("span", { class: "chev", "aria-hidden": "true" }), el("span", { text: s.title })]),
        el("span", { class: "n", text: items.length + (items.length === 1 ? " story" : " stories") })
      ]);
      sec.appendChild(el("h2", null, [btn]));
      var deskBody = el("div", { id: bodyId });
      sec.appendChild(deskBody);
      if (s.note) deskBody.appendChild(el("p", { class: "quiet", text: s.note }));
      var ul = el("ul", { class: "stories" + (items.length === 1 ? " single" : "") });
      items.forEach(function (it) {
        ul.appendChild(el("li", { class: "story" }, [
          it.kicker ? el("span", { class: "kick", text: it.kicker }) : null,
          el("h3", { text: it.lead }),
          el("p", { text: it.body }),
          it.why ? el("div", { class: "why" }, [el("b", { text: "Why it matters: " }), it.why]) : null,
          it.source ? el("span", { class: "src" }, [link(it.source.name, it.source.url)]) : null
        ]));
      });
      deskBody.appendChild(ul);
      root.appendChild(sec);
      setOpen(sec, s.key === "ux", false);
    });
    syncAll();

    if (iss.sources && iss.sources.length) {
      var ol = el("ol");
      iss.sources.forEach(function (s) { ol.appendChild(el("li", null, [link(s.title, s.url), el("span", { class: "d", text: s.date ? " · " + s.date : "" })])); });
      root.appendChild(el("details", { class: "sources" }, [el("summary", { class: "label", text: "Sources (" + iss.sources.length + ")" }), ol]));
    }
  }

  function isOpen(sec) { var b = sec.querySelector(".desk-toggle"); return !b || b.getAttribute("aria-expanded") === "true"; }
  function setOpen(sec, open, remember) {
    var b = sec.querySelector(".desk-toggle");
    var body = document.getElementById(b.getAttribute("aria-controls"));
    b.setAttribute("aria-expanded", open ? "true" : "false");
    if (body) body.hidden = !open;
  }
  function syncAll() {
    var b = document.getElementById("toggle-all");
    if (!b) return;
    var anyOpen = Array.prototype.some.call(document.querySelectorAll("section.desk"), function (d) { return isOpen(d); });
    b.textContent = anyOpen ? "Collapse all" : "Expand all";
  }

  function current() {
    var h = (location.hash || "").slice(1);
    for (var i = 0; i < issues.length; i++) if (slug(issues[i].id) === h) return issues[i];
    return issues[0];
  }
  function show() { var iss = current(); renderArchive(iss); renderIssue(iss); }

  document.addEventListener("click", function (e) {
    var tog = e.target.closest && e.target.closest(".desk-toggle");
    if (tog) {
      var sec = tog.closest("section.desk");
      setOpen(sec, tog.getAttribute("aria-expanded") !== "true", true);
      syncAll();
      return;
    }
    var a = e.target.closest && e.target.closest("a[data-target]");
    if (!a) return;
    e.preventDefault();
    var t = document.getElementById(a.getAttribute("data-target"));
    if (t && t.classList.contains("desk") && !isOpen(t)) { setOpen(t, true, true); syncAll(); }
    if (t) t.scrollIntoView();
  });
  var docEl = document.documentElement;
  var toggle = document.getElementById("theme-toggle");
  var themeLabel = document.getElementById("theme-label");
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function effective() {
    var t = docEl.getAttribute("data-theme");
    if (t === "dark" || t === "light") return t;
    return mq && mq.matches ? "dark" : "light";
  }
  function syncToggle() {
    var dark = effective() === "dark";
    themeLabel.textContent = dark ? "Light mode" : "Dark mode";
    toggle.setAttribute("aria-pressed", dark ? "true" : "false");
    toggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  var saved = null;
  try { saved = localStorage.getItem("briefing-theme"); } catch (e) {}
  docEl.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
  toggle.addEventListener("click", function () {
    var next = effective() === "dark" ? "light" : "dark";
    docEl.setAttribute("data-theme", next);
    try { localStorage.setItem("briefing-theme", next); } catch (e) {}
    syncToggle();
  });
  if (mq && mq.addEventListener) mq.addEventListener("change", syncToggle);
  syncToggle();

  window.addEventListener("hashchange", function () { show(); window.scrollTo(0, 0); });
  show();
})();
</script>
